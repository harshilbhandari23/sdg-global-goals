# Builds the pages from data/ and publishes them with GitHub Pages on every push to main
# (including the commits the /admin editor makes).
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # refresh the live news every 3 hours

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest SDG news
        run: python3 tools/fetch_news.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Build pages from data/
        run: python3 build.py
      - name: Remove files that should not be published
        run: rm -rf .git .github tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
